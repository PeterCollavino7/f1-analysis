name: probe-livetiming
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://livetiming.formula1.com/static/2026/2026-09-13_Spanish_Grand_Prix/2026-09-13_Race
          for u in https://livetiming.formula1.com/static/2026/Index.json \
                   $B/SessionInfo.json $B/DriverList.json $B/TimingData.jsonStream \
                   https://api.jolpi.ca/ergast/f1/2026.json; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' "$u")"
          done
