name: probe-dhl
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://inmotion.dhl/api/f1-award-element-data/7373 https://inmotion.dhl/formula-1/fastest-pit-stop-award-2025; do
            echo "$u -> $(curl -sL -o /dev/null -w '%{http_code} %{size_download}' -A 'Mozilla/5.0' "$u")"
          done
